name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  python-test:
    name: Python Data-Bridge Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r data-bridge/requirements.txt
        pip install pytest pytest-cov httpx

    - name: Run tests with coverage
      run: |
        cd data-bridge
        pytest --cov=. --cov-report=term-missing --cov-report=xml

  node-test:
    name: TradingView MCP Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Clone TradingView MCP repository
      run: |
        git clone https://github.com/tradesdontlie/tradingview-mcp.git tradingview-mcp
        cd tradingview-mcp
        git checkout 4795784a19dd64ff4e2649d2499a536b01bd2d68

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        cd tradingview-mcp
        npm install

    - name: Run unit tests
      run: |
        cd tradingview-mcp
        npm run test:unit
